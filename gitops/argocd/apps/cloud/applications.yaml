apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-demo-cloud-backend
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: hybrid-demo
  source:
    repoURL: https://github.com/jetzlstorfer/hybrid-multi-agents.git
    targetRevision: HEAD
    path: gitops/overlays/aro-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: hybrid-demo-cloud
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-demo-project
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/jetzlstorfer/hybrid-multi-agents.git
    targetRevision: HEAD
    path: gitops/argocd/projects
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated: { prune: true, selfHeal: true }