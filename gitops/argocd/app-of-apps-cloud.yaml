# Argo CD Application that bootstraps the cloud/ARO deployment.
#
#   oc apply -f gitops/argocd/app-of-apps-cloud.yaml
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hybrid-demo-cloud-bootstrap
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/jetzlstorfer/hybrid-multi-agents.git
    targetRevision: HEAD
    path: gitops/argocd/apps/cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true