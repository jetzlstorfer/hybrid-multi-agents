apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend
  labels:
    app.kubernetes.io/name: cloud-backend
    app.kubernetes.io/part-of: hybrid-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cloud-backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloud-backend }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/hybrid-multi-agents/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HYBRID_DEMO_DEPLOYMENT_MODE
              value: cloud
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hybrid-demo-cloud
                  key: FOUNDRY_PROJECT_ENDPOINT
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: hybrid-demo-cloud
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-backend
spec:
  selector: { app.kubernetes.io/name: cloud-backend }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cloud-backend
spec:
  to: { kind: Service, name: cloud-backend }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect