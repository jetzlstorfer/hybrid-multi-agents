apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend
  labels:
    app.kubernetes.io/name: cloud-backend
    app.kubernetes.io/part-of: hybrid-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cloud-backend }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: cloud-backend
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/hybrid-multi-agents/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HYBRID_DEMO_DEPLOYMENT_MODE
              value: cloud
            - name: HYBRID_DEMO_MODELS_FILE
              value: /config/models.yaml
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: hybrid-demo-cloud
                  key: FOUNDRY_PROJECT_ENDPOINT
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: hybrid-demo-cloud
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
                  optional: true
          volumeMounts:
            - name: models
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi }
      volumes:
        - name: models
          configMap:
            name: hybrid-demo-models
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-backend
spec:
  selector: { app.kubernetes.io/name: cloud-backend }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cloud-backend
  annotations:
    # 3-minute timeout for long-running Foundry model inference calls
    haproxy.router.openshift.io/timeout: 180s
spec:
  host: cloud-backend-hybrid-demo-cloud.apps.aros5iu.austriaeast.aroapp.io
  to: { kind: Service, name: cloud-backend }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect