apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: hybrid-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/hybrid-multi-agents/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: HYBRID_DEMO_MODELS_FILE
              value: /config/models.yaml
            - name: FOUNDRY_PROJECT_ENDPOINT
              valueFrom: { secretKeyRef: { name: hybrid-demo-cloud, key: FOUNDRY_PROJECT_ENDPOINT } }
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: hybrid-demo-cloud, key: APPLICATIONINSIGHTS_CONNECTION_STRING } }
            - name: HYBRID_DEMO_CLOUD_BACKEND_URL
              valueFrom: { secretKeyRef: { name: hybrid-demo-cloud, key: HYBRID_DEMO_CLOUD_BACKEND_URL } }
            - name: HYBRID_DEMO_PII_TIMEOUT_SECONDS
              value: "1800"
            # Foundry Local on the host is reached via the ExternalName Service
            # 'foundry-local' (deployed by the hybrid-demo-foundry-local Argo app).
            - name: FOUNDRY_LOCAL_ENDPOINT
              value: http://foundry-local:5273
          volumeMounts:
            - name: models
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 1Gi  }
      volumes:
        - name: models
          configMap:
            name: hybrid-demo-models
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: { app.kubernetes.io/name: backend }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
spec:
  to: { kind: Service, name: backend }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
