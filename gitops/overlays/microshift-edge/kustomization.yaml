apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hybrid-demo
resources:
- backend.yaml
- web.yaml

# Image tags are mutated by .github/workflows/gitops-bump.yaml when a new
# image is built and pushed to GHCR. Do not edit manually.
images:
- name: ghcr.io/hybrid-multi-agents/backend
  newTag: latest
- name: ghcr.io/hybrid-multi-agents/web
  newTag: latest
- name: ghcr.io/jetzlstorfer/hybrid-multi-agents/backend
  newName: ghcr.io/jetzlstorfer/hybrid-multi-agents/backend
  newTag: sha-10bd8d0967a2cc1f9a0ce950eb30cc831c4916c6

  # MicroShift is single-node: no PDBs, no anti-affinity, replicas pinned to 1.
patches:
- patch: |
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: backend
- patch: |
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: web
