# Central model registry for the hybrid multi-agent demo.
#
# All agent code references logical roles (edge.slm, edge.transcription,
# cloud.research, cloud.explanation). Model names live ONLY here and can be
# overridden at runtime via env vars, e.g.:
#
#   HYBRID_DEMO__EDGE__SLM__MODEL=phi-4-mini-reasoning
#   HYBRID_DEMO__CLOUD__RESEARCH__MODEL=gpt-5.4
#
edge:
  transcription:
    provider: foundry-local
    model: whisper-large-v3-turbo
    options:
      language: de
  slm:
    provider: foundry-local
    model: phi-4-mini
    options:
      temperature: 0.1
      max_tokens: 256

cloud:
  research:
    provider: foundry
    endpoint_env: FOUNDRY_PROJECT_ENDPOINT
    model: gpt-5.4-mini-1
    options:
      temperature: 0.2
  explanation:
    provider: foundry
    endpoint_env: FOUNDRY_PROJECT_ENDPOINT
    model: gpt-5.4-mini-1
    options:
      temperature: 0.2
